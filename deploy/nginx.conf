# Installed to /etc/nginx/sites-available/tgyt.conf by deploy/install.sh,
# which substitutes __PUBLIC_HOST__ and __WEB_PORT__ and then runs certbot
# against this vhost (certbot rewrites the ssl_certificate lines in place).
#
# Mode A (OAUTH_MODE=hostname) only -- not installed/enabled in loopback mode,
# where uvicorn terminates TLS directly instead. See bot/main.py.

server {
    listen __WEB_PORT__ ssl;
    listen [::]:__WEB_PORT__ ssl;
    server_name __PUBLIC_HOST__;

    # certbot --nginx fills these in for real; placeholders here just let
    # `nginx -t` pass before the first certbot run.
    ssl_certificate     /etc/tgyt/tls/selfsigned.crt;
    ssl_certificate_key /etc/tgyt/tls/selfsigned.key;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HTMX polling / long-ish requests; keep this generous but bounded.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name __PUBLIC_HOST__;

    # Only needed transiently for certbot's HTTP-01 challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host__WEB_PORT_SUFFIX__$request_uri;
    }
}
