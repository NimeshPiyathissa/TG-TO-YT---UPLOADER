{#- Line icons, one sprite rendered once in base.html. Use: {% from "partials/_icons.html" import icon %}{{ icon("jobs") }} -#}
{% macro icon(name) -%}<svg class="i" aria-hidden="true" focusable="false"><use href="#i-{{ name }}"/></svg>{%- endmacro %}
{% macro theme_switch() -%}
<div class="theme-seg" role="group" aria-label="Colour theme">
  <button type="button" data-theme-set="light" aria-pressed="false" title="Light">{{ icon("sun") }}<span>Light</span></button>
  <button type="button" data-theme-set="dark" aria-pressed="false" title="Dark">{{ icon("moon") }}<span>Dark</span></button>
  <button type="button" data-theme-set="system" aria-pressed="false" title="System">{{ icon("auto") }}<span>System</span></button>
</div>
{%- endmacro %}
